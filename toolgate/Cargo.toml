[package]
name = "toolgate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Macaroon-style capability tokens for tool calls"

[features]
default = ["mcp"]
mcp = []

[dependencies]
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.5"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
